version: 2

models:
  - name: stg_servicenow_incidents
    description: Cleaned incidents sourced from Supabase
    columns:
      - name: incident_id
        description: Unique incident identifier
        tests:
          - unique
          - not_null

      - name: incident_number
        description: Human readable incident number
        tests:
          - not_null

      - name: ci_id
        description: Foreign key to the configuration item associated with the incident
        tests:
          - not_null

      - name: state
        description: Current state of the incident
        tests:
          - not_null

      - name: created_at
        description: Timestamp when incident was created
        tests:
          - not_null

  - name: stg_servicenow_configuration_items
    description: Cleaned configuration items sourced from Supabase
    columns:
      - name: record_id
        description: Unique record identifier
        tests:
          - unique
          - not_null
      
      - name: record_name
        description: Name of the configuration item
        tests:
          - not_null
      
      - name: created_at
        description: Timestamp when the configuration item was created
        tests:
          - not_null

  - name: stg_servicenow_change_requests
    description: Cleaned change requests sourced from Supabase
    columns:
      - name: change_request_id
        description: Unique change request identifier
        tests:
          - unique
          - not_null

      - name: change_request_number
        description: Human readable change request number
        tests:
          - not_null

      - name: title
        description: Title of the change request

      - name: description
        description: Detailed description of the change request

      - name: status
        description: Current status of the change request

      - name: risk
        description: Risk level of the change request

      - name: created_at
        description: Timestamp when change request was created
        tests:
          - not_null

      - name: updated_at
        description: Timestamp when change request was last updated

  - name: stg_application_roles
    description: Cleaned application roles sourced from Supabase
    columns:
      - name: role_id
        description: Unique role identifier
        tests:
          - unique
          - not_null

      - name: role_name
        description: Name of the role
        tests:
          - not_null

      - name: user_id
        description: Foreign key to the user assigned this role
        tests:
          - not_null

  - name: stg_users
    description: Cleaned users sourced from Supabase
    columns:
      - name: user_id
        description: Unique user identifier (UUID)
        tests:
          - unique
          - not_null

      - name: email
        description: User email address
        tests:
          - unique
          - not_null

      - name: full_name
        description: User full name
        tests:
          - not_null

      - name: title
        description: Job title of the user

      - name: department_id
        description: UUID of the department this user belongs to

      - name: is_active
        description: Whether the user account is active
        tests:
          - not_null

      - name: role
        description: Role assigned to the user
        tests:
          - not_null

      - name: metadata
        description: Additional user metadata stored as JSON

      - name: created_at
        description: Timestamp when the user was created
        tests:
          - not_null

      - name: updated_at
        description: Timestamp when the user was last updated
        tests:
          - not_null

  - name: application_roles_with_users
    description: Application roles enriched with user details, inner joined on user_id
    columns:
      - name: role_id
        description: Unique role identifier
        tests:
          - not_null

      - name: role_name
        description: Name of the role
        tests:
          - not_null

      - name: user_id
        description: Unique user identifier
        tests:
          - not_null

      - name: email
        description: User email address

      - name: full_name
        description: User full name

      - name: title
        description: Job title of the user

      - name: department_id
        description: UUID of the department this user belongs to

      - name: is_active
        description: Whether the user account is active

      - name: role
        description: Role assigned to the user in the users table

      - name: metadata
        description: Additional user metadata stored as JSON

      - name: created_at
        description: Timestamp when the user was created

      - name: updated_at
        description: Timestamp when the user was last updated

  - name: incidents_with_configuration_items
    description: Incidents enriched with the latest configuration item name
    columns:
      - name: incident_id
        description: Unique incident identifier
        tests:
          - unique
          - not_null
      
      - name: configuration_item_name
        description: Name of the related configuration item (latest snapshot)

  - name: incidents_with_change_requests
    description: Incidents enriched with associated change request number
    columns:
      - name: incident_id
        description: Unique incident identifier
        tests:
          - unique
          - not_null
      
      - name: change_request_number
        description: Number of the change request that caused this incident (if applicable)
